<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Students Progress Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hide { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="bg-[#003366] text-white p-6 rounded-2xl shadow-lg mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-black uppercase">Students Progress Analytics</h1>
                <p class="text-xs text-orange-400 font-bold mt-1">Kaushal Institute Administration Panel</p>
            </div>
            <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase transition-all border border-white/20">Back to Portal</a>
        </header>

        <div id="loading" class="text-center py-20">
            <i class="fas fa-spinner fa-spin text-4xl text-[#003366] mb-3"></i>
            <p class="text-slate-500 font-bold text-sm uppercase">Loading student records...</p>
        </div>

        <div id="students-container" class="space-y-4"></div>
    </div>

    <script>
        // --- NEW FIREBASE CONFIGURATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyAKTH95QIT__fUZvNDxwY2_C1j0Ex5HFjk",
          authDomain: "o-level-mcqs.firebaseapp.com",
          projectId: "o-level-mcqs",
          storageBucket: "o-level-mcqs.firebasestorage.app",
          messagingSenderId: "511777254462",
          appId: "1:511777254462:web:bcc62be13995a9b0eb756f",
          measurementId: "G-RF63PL9GBR"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        async function fetchDashboardData() {
            try {
                const usersSnap = await database.ref('registered_users').once('value');
                const resultsSnap = await database.ref('student_results').once('value');

                const users = usersSnap.val() || {};
                const results = resultsSnap.val() || {};

                const container = document.getElementById('students-container');
                container.innerHTML = '';
                document.getElementById('loading').classList.add('hide');

                if(Object.keys(users).length === 0) {
                    container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 font-bold">Koi registered user nahi mila.</div>`;
                    return;
                }

                // Map results by email
                let userResultsMap = {};
                for(let rKey in results) {
                    let res = results[rKey];
                    let email = res.studentEmail ? res.studentEmail.toLowerCase() : '';
                    if(!email && res.studentName) email = res.studentName.toLowerCase(); // fallback
                    
                    if(!userResultsMap[email]) userResultsMap[email] = [];
                    userResultsMap[email].push(res);
                }

                for(let uKey in users) {
                    let user = users[uKey];
                    let emailKey = user.email.toLowerCase();
                    let userAttempts = userResultsMap[emailKey] || [];

                    let card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden transition-all";

                    let attemptsHTML = '';
                    if(userAttempts.length === 0) {
                        attemptsHTML = `<p class="text-xs text-slate-400 italic py-2">Is user ne abhi tak koi test attempt nahi kiya hai.</p>`;
                    } else {
                        userAttempts.forEach((att, idx) => {
                            attemptsHTML += `
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <div>
                                        <span class="bg-blue-900 text-white text-[10px] font-bold px-2.5 py-1 rounded-md uppercase">Attempt #${idx+1} (${att.moduleCode})</span>
                                        <span class="text-xs text-slate-500 ml-2 font-medium"><i class="far fa-clock"></i> ${att.submittedAt}</span>
                                    </div>
                                    <div class="flex items-center gap-3 text-xs font-bold">
                                        <span class="bg-green-100 text-green-700 px-3 py-1 rounded-lg">Correct: ${att.correctAnswers}</span>
                                        <span class="bg-red-100 text-red-700 px-3 py-1 rounded-lg">Wrong: ${att.wrongAnswers}</span>
                                        <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-lg">Score: ${att.scorePercentage} (Grade: ${att.grade})</span>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    card.innerHTML = `
                        <div class="p-5 flex items-center justify-between cursor-pointer hover:bg-slate-50 select-none" onclick="toggleAccordion(this)">
                            <div class="flex items-center gap-4">
                                <img src="${user.img || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded-full object-cover border-2 border-slate-200 shadow-inner">
                                <div>
                                    <h3 class="font-bold text-slate-800 text-base">${user.name}</h3>
                                    <p class="text-xs text-slate-400">${user.email} • Registered: ${user.registeredAt}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="bg-orange-100 text-orange-700 font-bold text-xs px-3 py-1 rounded-full">${userAttempts.length} Tests Given</span>
                                <i class="fas fa-chevron-down text-slate-400 transition-transform duration-200 arrow-icon"></i>
                            </div>
                        </div>
                        <div class="details-pane hide p-5 border-t border-slate-100 bg-white space-y-3">
                            <h4 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-2">Performance History</h4>
                            ${attemptsHTML}
                        </div>
                    `;

                    container.appendChild(card);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = `<p class="text-red-500 font-bold text-sm">Data load karne mein error aayi hai. Firebase Rules check karein.</p>`;
            }
        }

        function toggleAccordion(headerEl) {
            const detailsPane = headerEl.nextElementSibling;
            const arrow = headerEl.querySelector('.arrow-icon');
            
            detailsPane.classList.toggle('hide');
            arrow.style.transform = detailsPane.classList.contains('hide') ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        fetchDashboardData();
    </script>
</body>
</html>
